[tools]
go = "1.26.2"
shellcheck = "0.11.0"
hyperfine = "1.20.0"
svu = "3.4.0"
goreleaser = "2.15.2"

[env]
GOTOOLCHAIN = "local"

[tasks.test]
description = "Run cross-platform Go test suite"
run = "go test ./..."

[tasks.lint-shell]
description = "Lint shell scripts"
run = "shellcheck -x scripts/base-image-tag.sh scripts/cleanroom-root-helper.sh scripts/benchmark-tti.sh scripts/build-go.sh scripts/install-go.sh scripts/install.sh scripts/install-global.sh scripts/package-darwin-vz-helper.sh scripts/release.sh scripts/e2e-observability.sh scripts/ci-example-smoke.sh scripts/ci-examples-firecracker.sh scripts/ci-examples-darwin-vz.sh scripts/ci-cleanroom-e2e.sh scripts/ci-darwin-vz-e2e.sh scripts/ci-darwin-vz-filehandle-e2e.sh scripts/build-macos-release-pkg.sh scripts/notarize-macos-package.sh scripts/ci-macos-release-pkg.sh scripts/build-darwin-vz-minimal-kernel-release.sh scripts/ci-darwin-vz-kernel-release.sh scripts/ci-buildkite-release.sh"

[tasks.test-full]
description = "Run full Go test suite"
run = "go test ./..."

[tasks."build:go"]
description = "Build Go binaries into dist/"
run = "scripts/build-go.sh"

[tasks."build:darwin"]
description = "Build macOS darwin-vz helper into dist/"
run = "{% if os() == \"macos\" %}scripts/build-darwin-vz-helper.sh dist/cleanroom-darwin-vz.app{% else %}true{% endif %}"

[tasks."build:kernel:darwin-vz-minimal-initrd"]
description = "Build minimal darwin-vz initrd-profile Linux kernel into dist/"
run = "CLEANROOM_DARWIN_VZ_MINIMAL_KERNEL_PROFILE=initrd benchmarks/darwin-vz/minimal/build-kernel.sh"

[tasks."build:kernel:darwin-vz-minimal-rootfs"]
description = "Build minimal darwin-vz rootfs-profile Linux kernel into dist/"
run = "CLEANROOM_DARWIN_VZ_MINIMAL_KERNEL_PROFILE=rootfs benchmarks/darwin-vz/minimal/build-kernel.sh"

[tasks."build:image:alpine"]
description = "Build local alpine base image"
run = "docker build -f images/Dockerfile.base-image -t cleanroom-base:alpine ."

[tasks."build:image:alpine-docker"]
description = "Build local alpine-docker base image"
run = "docker build -f images/Dockerfile.base-image-docker -t cleanroom-base:alpine-docker ."

[tasks."build:image:alpine-agents"]
description = "Build local alpine-agents base image"
run = "docker build -f images/Dockerfile.base-image-agents -t cleanroom-base:alpine-agents ."

[tasks."build:image:debian"]
description = "Build local debian base image"
run = "docker build -f images/Dockerfile.base-image-debian -t cleanroom-base:debian ."

[tasks."build:image:debian-ruby"]
description = "Build local debian-ruby base image"
run = "docker build -f images/Dockerfile.base-image-debian-ruby -t cleanroom-base:debian-ruby ."

[tasks."build:image:debian-docker"]
description = "Build local debian-docker base image"
run = "docker build -f images/Dockerfile.base-image-debian-docker -t cleanroom-base:debian-docker ."

[tasks."build:image:debian-agents"]
description = "Build local debian-agents base image"
run = "docker build -f images/Dockerfile.base-image-debian-agents -t cleanroom-base:debian-agents ."

[tasks."build:images"]
description = "Build all local base images"
depends = [
  "build:image:debian",
  "build:image:debian-ruby",
  "build:image:debian-docker",
  "build:image:debian-agents",
  "build:image:alpine",
  "build:image:alpine-docker",
  "build:image:alpine-agents",
]
run = "true"

[tasks.build]
description = "Build binaries into dist/"
depends = ["build:go", "build:darwin"]
run = "true"

[tasks."install:go"]
description = "Install Go binaries into GOBIN (or GOPATH/bin)"
run = "scripts/install-go.sh"

[tasks."install:darwin"]
description = "Install macOS darwin-vz helper into GOBIN (or GOPATH/bin)"
depends = ["build:darwin"]
run = "{% if os() == \"macos\" %}BIN_DIR=\"$(go env GOBIN)\"; if [ -z \"$BIN_DIR\" ]; then BIN_DIR=\"$(go env GOPATH)/bin\"; fi; mkdir -p \"$BIN_DIR\" && scripts/build-darwin-vz-helper.sh \"$BIN_DIR/cleanroom-darwin-vz.app\"{% else %}true{% endif %}"

[tasks.install]
description = "Install all binaries into GOBIN (or GOPATH/bin)"
depends = ["install:go", "install:darwin"]
run = "true"

[tasks."install:global"]
description = "Install all runtime binaries into /usr/local/bin"
depends = ["build"]
run = "scripts/install-global.sh"

[tasks.doctor]
description = "Run cleanroom diagnostics"
run = "go run ./cmd/cleanroom doctor"

[tasks.doctor-json]
description = "Run cleanroom diagnostics as JSON"
run = "go run ./cmd/cleanroom doctor --json"

[tasks."observability:up"]
description = "Start the local observability stack"
run = "docker compose -f examples/observability/docker-compose.yaml up -d"

[tasks."observability:down"]
description = "Stop the local observability stack"
run = "docker compose -f examples/observability/docker-compose.yaml down -v"

[tasks.check]
description = "Run build, test, and lint"
depends = ["build", "test", "lint-shell"]
run = "true"

[tasks.release]
description = "Tag the next version and push to trigger a release"
depends = ["check"]
run = "scripts/release.sh"
