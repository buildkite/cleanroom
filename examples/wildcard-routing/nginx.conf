worker_processes  1;
pid /tmp/cleanroom-wildcard-routing-nginx.pid;
error_log /dev/stderr info;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  upstream app_backend {
    server 127.0.0.1:18080;
  }

  upstream redirect_backend {
    server 127.0.0.1:18081;
  }

  server {
    listen 80;
    server_name example.cleanroom.localhost;

    location / {
      default_type text/plain;
      return 200 "exact route ok\n";
    }
  }

  server {
    listen 80;
    server_name app.example.cleanroom.localhost;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_pass http://app_backend;
    }
  }

  server {
    listen 80;
    server_name s3.example.cleanroom.localhost;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_pass http://redirect_backend;
    }
  }
}
