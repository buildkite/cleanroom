version: 1
sandbox:
  image:
    ref: ghcr.io/buildkite/cleanroom-base/alpine@sha256:91a63856cdf97b2e5659660b41d1a131d3b57bfa4cad254018e391ffef6fa4b9
  services:
    - name: assets
      command: test -f examples/seeded-output-cache/public/assets/.keep && echo generated > examples/seeded-output-cache/public/assets/generated.txt
      inputs:
        files:
          - examples/seeded-output-cache/cleanroom.yaml
          - examples/seeded-output-cache/public/assets/.keep
      outputs:
        dirs:
          - examples/seeded-output-cache/public/assets
  network:
    default: deny
    allow:
      - host: github.com
        ports: [443]
