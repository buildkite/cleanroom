version: 2

builds:
  - id: cleanroom-linux
    main: ./cmd/cleanroom
    binary: cleanroom
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: cleanroom-darwin
    main: ./cmd/cleanroom
    binary: cleanroom
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: cleanroom
    ids: [cleanroom-linux, cleanroom-darwin]
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

release:
  header: |
    {{- if eq .Tag "v0.12.0" }}
    ## Breaking SporeVM redesign

    Cleanroom v0.12.0 replaces the old runtime/control-plane surface with a focused bake surface: `policy validate`, `compile`, `stamp`, `bake`, `verify`, `gateway serve`, and `version`.

    - Old runtime/control-plane commands were removed.
    - Existing spores and artifacts must be rebaked because the bake key moved to keyVersion 2.
    - `scripts/install.sh` and the installer now refuse to install without release checksums.

    {{- end }}

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
