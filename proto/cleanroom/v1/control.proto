syntax = "proto3";

package cleanroom.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/buildkite/cleanroom/internal/gen/cleanroom/v1;cleanroomv1";

service SandboxService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc CreateSandboxStream(CreateSandboxRequest) returns (stream CreateSandboxEvent);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc DownloadSandboxFile(DownloadSandboxFileRequest) returns (DownloadSandboxFileResponse);
  rpc UploadSandboxFile(UploadSandboxFileRequest) returns (UploadSandboxFileResponse);
  rpc StatSandboxPath(StatSandboxPathRequest) returns (StatSandboxPathResponse);
  rpc WalkSandboxTree(WalkSandboxTreeRequest) returns (stream WalkSandboxTreeResponse);
  rpc ReadSandboxFile(ReadSandboxFileRequest) returns (stream ReadSandboxFileResponse);
  rpc WriteSandboxFile(stream WriteSandboxFileRequest) returns (WriteSandboxFileResponse);
  rpc RemoveSandboxPath(RemoveSandboxPathRequest) returns (RemoveSandboxPathResponse);
  rpc ArchiveSandboxPaths(ArchiveSandboxPathsRequest) returns (stream ArchiveSandboxPathsResponse);
  rpc ExtractSandboxArchive(stream ExtractSandboxArchiveRequest) returns (ExtractSandboxArchiveResponse);
  rpc SuspendSandbox(SuspendSandboxRequest) returns (SuspendSandboxResponse);
  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse);
  rpc TerminateSandbox(TerminateSandboxRequest) returns (TerminateSandboxResponse);
  rpc StreamSandboxEvents(StreamSandboxEventsRequest) returns (stream SandboxEvent);
  rpc DialSandboxPort(stream SandboxPortFrame) returns (stream SandboxPortFrame);
}

service SnapshotService {
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
}

service CachePeerService {
  rpc LookupCachePeer(LookupCachePeerRequest) returns (LookupCachePeerResponse);
}

service ExecutionService {
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
  rpc CreateExecution(CreateExecutionRequest) returns (CreateExecutionResponse);
  rpc AttachExecution(AttachExecutionRequest) returns (AttachExecutionResponse);
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
  rpc InspectExecution(InspectExecutionRequest) returns (InspectExecutionResponse);
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
  rpc WriteExecutionStdin(WriteExecutionStdinRequest) returns (WriteExecutionStdinResponse);
  rpc CloseExecutionStdin(CloseExecutionStdinRequest) returns (CloseExecutionStdinResponse);
  rpc StreamExecution(StreamExecutionRequest) returns (stream ExecutionStreamEvent);
}

message Sandbox {
  string sandbox_id = 1;
  SandboxStatus status = 2;
  string backend = 3;
  string policy_hash = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string last_execution_id = 7;
  string active_execution_id = 8;
  string source_kind = 9;
  string source_id = 10;
  string backing_snapshot_id = 11;
  RepositoryCheckout repository_checkout = 12;
  map<string, bool> backend_capabilities = 13;
  // Resolved backend resource ceilings for this sandbox.
  SandboxResources effective_resources = 14;
}

message PortExposure {
  string protocol = 1;
  int32 guest_port = 2;
  int32 host_port = 3;
  string name = 4;
  string hostname = 5;
  string url = 6;
}

message SandboxPortFrame {
  oneof payload {
    SandboxPortOpen open = 1;
    bytes data = 2;
    SandboxPortCloseWrite close_write = 3;
    SandboxPortOpenResult open_result = 4;
  }
}

message SandboxPortOpen {
  string sandbox_id = 1;
  int32 guest_port = 2;
}

message SandboxPortCloseWrite {}

message Snapshot {
  string snapshot_id = 1;
  string source_sandbox_id = 2;
  string backend = 3;
  string policy_hash = 4;
  string name = 5;
  google.protobuf.Timestamp created_at = 6;
  string storage_driver = 7;
  string storage_ref = 8;
  RepositoryCheckout repository_checkout = 9;
}

enum SandboxStatus {
  SANDBOX_STATUS_UNSPECIFIED = 0;
  SANDBOX_STATUS_PROVISIONING = 1;
  SANDBOX_STATUS_READY = 2;
  SANDBOX_STATUS_STOPPING = 3;
  SANDBOX_STATUS_STOPPED = 4;
  SANDBOX_STATUS_FAILED = 5;
  SANDBOX_STATUS_SUSPENDING = 6;
  SANDBOX_STATUS_SUSPENDED = 7;
  SANDBOX_STATUS_WAKING = 8;
}

message PolicyAllowRule {
  string host = 1;
  repeated int32 ports = 2;
}

message PolicyDocker {
  bool required = 1;
}

message PolicyBlockInputs {
  repeated string files = 1;
}

message PolicyBlockOutputs {
  repeated string dirs = 1;
  repeated string files = 2;
}

message PolicyBlock {
  string name = 1;
  repeated string command = 2;
  PolicyBlockInputs inputs = 3;
  map<string, string> env = 4;
  PolicyBlockOutputs outputs = 5;
}

message PolicyServices {
  reserved 1, 2, 3;
  reserved "docker", "command", "key";
  repeated PolicyBlock blocks = 4;
}

message PolicyDependencies {
  reserved 1, 2;
  reserved "command", "key";
  string reuse = 3;
  repeated PolicyBlock blocks = 4;
}

message PolicyRun {
  repeated string before = 1;
}

message PolicyNetwork {
  repeated PolicyAllowRule allow = 1;
}

message PolicyNetworkStages {
  PolicyNetwork workspace = 1;
  PolicyNetwork dependencies = 2;
  PolicyNetwork services = 3;
  PolicyNetwork execution = 4;
}

// PolicyResources declares backend-neutral minimum workload requirements.
// These values are floors, not exact reservations: control-plane code raises
// lower backend runtime settings to meet them and preserves larger runtime
// defaults. Backends decide how those effective ceilings map to host resources.
message PolicyResources {
  // Minimum effective vCPU ceiling required by the workload.
  int64 vcpus = 1;
  // Minimum effective memory ceiling required by the workload, in bytes.
  int64 memory_bytes = 2;
  // Minimum writable root filesystem capacity required by the workload, in bytes.
  int64 disk_bytes = 3;
}

message Policy {
  int32 version = 1;
  string image_ref = 2;
  string image_digest = 3;
  string network_default = 4;
  repeated PolicyAllowRule allow = 5;
  string hash = 6;
  PolicyServices services = 7;
  PolicyDependencies dependencies = 9;
  PolicyRun run = 10;
  PolicyResources resources = 11;
  PolicyNetworkStages network_stages = 12;
  PolicyDocker docker = 13;
}

message SandboxOptions {
  reserved 2;
  reserved "read_only_workspace";
  int64 launch_seconds = 3;
  // Explicitly request allow-all egress for a newly created sandbox. Policy
  // protobufs remain deny-by-default; this option is the only API surface for
  // the dangerous escape hatch used by CLI --dangerously-allow-all.
  bool dangerously_allow_all_egress = 4;
}

message RepositoryCheckout {
  string remote_url = 1;
  string commit_sha = 2;
  string destination_dir = 3;
  bool submodules = 4;
  string branch = 7;
  reserved 5, 6;
  reserved "git_config_key", "git_config_value";
}

message RepositoryChangesetFile {
  string path = 1;
  string sha256 = 2;
  bool deleted = 3;
}

message RepositoryChangeset {
  string format = 1;
  string base_commit_sha = 2;
  string digest = 3;
  string tree_digest = 4;
  bytes patch = 5;
  repeated RepositoryChangesetFile files = 6;
}

message RepositoryCommitBundle {
  string format = 1;
  string target_commit_sha = 2;
  string digest = 3;
  bytes bundle = 4;
}

message CreateSandboxRequest {
  reserved 1;
  reserved "cwd";
  string backend = 2;
  SandboxOptions options = 3;
  Policy policy = 4;
  RepositoryCheckout repository_checkout = 5;
  RepositoryChangeset repository_changeset = 7;
  RepositoryCommitBundle repository_commit_bundle = 8;
  oneof source {
    string snapshot_id = 6;
  }
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
  string policy_source = 2;
  string message = 3;
  string source_kind = 4;
  string source_id = 5;
  string backing_snapshot_id = 6;
}

enum CreateSandboxPhase {
  CREATE_SANDBOX_PHASE_UNSPECIFIED = 0;
  CREATE_SANDBOX_PHASE_RESTORE_SNAPSHOT = 1;
  CREATE_SANDBOX_PHASE_LOOKUP_DEPENDENCY_STAGE_CACHE = 2;
  CREATE_SANDBOX_PHASE_RESTORE_DEPENDENCY_STAGE_CACHE = 3;
  CREATE_SANDBOX_PHASE_LOOKUP_WORKSPACE_STAGE_CACHE = 4;
  CREATE_SANDBOX_PHASE_RESTORE_WORKSPACE_STAGE_CACHE = 5;
  CREATE_SANDBOX_PHASE_PROVISION_SANDBOX = 6;
  CREATE_SANDBOX_PHASE_BOOTSTRAP_REPOSITORY = 7;
  CREATE_SANDBOX_PHASE_PUBLISH_WORKSPACE_STAGE_CACHE = 8;
  CREATE_SANDBOX_PHASE_BOOTSTRAP_DEPENDENCIES = 9;
  CREATE_SANDBOX_PHASE_PUBLISH_DEPENDENCY_STAGE_CACHE = 10;
  CREATE_SANDBOX_PHASE_READY = 11;
  CREATE_SANDBOX_PHASE_APPLY_REPOSITORY_CHANGESET = 12;
  CREATE_SANDBOX_PHASE_LOOKUP_SERVICES_STAGE_CACHE = 13;
  CREATE_SANDBOX_PHASE_RESTORE_SERVICES_STAGE_CACHE = 14;
  CREATE_SANDBOX_PHASE_BOOTSTRAP_SERVICES = 15;
  CREATE_SANDBOX_PHASE_PUBLISH_SERVICES_STAGE_CACHE = 16;
}

message CreateSandboxEvent {
  CreateSandboxPhase phase = 1;

  oneof payload {
    string message = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    string warning = 5;
    CreateSandboxResponse response = 6;
  }

  google.protobuf.Timestamp occurred_at = 7;
}

message GetSandboxRequest {
  string sandbox_id = 1;
}

message GetSandboxResponse {
  Sandbox sandbox = 1;
}

message ListSandboxesRequest {}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message ListExecutionsRequest {
  string sandbox_id = 1;
  bool all = 2;
}

message ListExecutionsResponse {
  repeated Execution executions = 1;
}

message DownloadSandboxFileRequest {
  string sandbox_id = 1;
  string path = 2;
  int64 max_bytes = 3;
}

message DownloadSandboxFileResponse {
  string sandbox_id = 1;
  string path = 2;
  bytes data = 3;
  int64 size_bytes = 4;
}

message UploadSandboxFileRequest {
  string sandbox_id = 1;
  string path = 2;
  bytes data = 3;
  uint32 mode = 4;
}

message UploadSandboxFileResponse {
  string sandbox_id = 1;
  string path = 2;
  int64 size_bytes = 3;
}

enum SandboxPathType {
  SANDBOX_PATH_TYPE_UNSPECIFIED = 0;
  SANDBOX_PATH_TYPE_FILE = 1;
  SANDBOX_PATH_TYPE_DIRECTORY = 2;
  SANDBOX_PATH_TYPE_SYMLINK = 3;
  SANDBOX_PATH_TYPE_OTHER = 4;
}

message SandboxPathInfo {
  string path = 1;
  SandboxPathType type = 2;
  int64 size_bytes = 3;
  uint32 mode = 4;
  google.protobuf.Timestamp mtime = 5;
  string symlink_target = 6;
}

message StatSandboxPathRequest {
  string sandbox_id = 1;
  string path = 2;
}

message StatSandboxPathResponse {
  SandboxPathInfo info = 1;
}

message WalkSandboxTreeRequest {
  string sandbox_id = 1;
  string path = 2;
}

message WalkSandboxTreeResponse {
  SandboxPathInfo info = 1;
}

message ReadSandboxFileRequest {
  string sandbox_id = 1;
  string path = 2;
  int64 max_bytes = 3;
}

message ReadSandboxFileResponse {
  bytes data = 1;
}

message WriteSandboxFileInit {
  string sandbox_id = 1;
  string path = 2;
  uint32 mode = 3;
  google.protobuf.Timestamp mtime = 4;
}

message WriteSandboxFileRequest {
  oneof payload {
    WriteSandboxFileInit init = 1;
    bytes data = 2;
  }
}

message WriteSandboxFileResponse {
  string sandbox_id = 1;
  string path = 2;
  int64 size_bytes = 3;
}

message RemoveSandboxPathRequest {
  string sandbox_id = 1;
  string path = 2;
  bool recursive = 3;
}

message RemoveSandboxPathResponse {
  string sandbox_id = 1;
  string path = 2;
  bool removed = 3;
}

message ArchiveSandboxPathsRequest {
  string sandbox_id = 1;
  repeated string paths = 2;
  int64 max_bytes = 3;
}

message ArchiveSandboxPathsResponse {
  bytes data = 1;
}

message ExtractSandboxArchiveInit {
  string sandbox_id = 1;
  string destination = 2;
}

message ExtractSandboxArchiveRequest {
  oneof payload {
    ExtractSandboxArchiveInit init = 1;
    bytes data = 2;
  }
}

message ExtractSandboxArchiveResponse {
  string sandbox_id = 1;
  string destination = 2;
  int64 size_bytes = 3;
}

message TerminateSandboxRequest {
  string sandbox_id = 1;
}

message TerminateSandboxResponse {
  string sandbox_id = 1;
  bool terminated = 2;
  string message = 3;
}

message SuspendSandboxRequest {
  string sandbox_id = 1;
}

message SuspendSandboxResponse {
  Sandbox sandbox = 1;
}

message ResumeSandboxRequest {
  string sandbox_id = 1;
}

message ResumeSandboxResponse {
  Sandbox sandbox = 1;
}

message StreamSandboxEventsRequest {
  string sandbox_id = 1;
  bool follow = 2;
}

message SandboxEvent {
  string sandbox_id = 1;
  SandboxStatus status = 2;
  string message = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message CreateSnapshotRequest {
  string sandbox_id = 1;
  string name = 2;
}

message CreateSnapshotResponse {
  Snapshot snapshot = 1;
  string message = 2;
}

message GetSnapshotRequest {
  string snapshot_id = 1;
}

message GetSnapshotResponse {
  Snapshot snapshot = 1;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
}

message DeleteSnapshotResponse {
  string snapshot_id = 1;
  bool deleted = 2;
  string message = 3;
}

message LookupCachePeerRequest {
  string stage = 1;
  string cache_key = 2;
  string backend = 3;
  string storage_driver = 4;
  string architecture = 5;
  string producer_version = 6;
  string policy_hash = 7;
  string parent_cache_key = 8;
  string parent_zfs_snapshot_guid = 9;
  string parent_stage = 10;
}

message LookupCachePeerResponse {
  CachePeerCandidate candidate = 1;
  string miss_reason = 2;
}

message CachePeerCandidate {
  string transfer_token = 1;
  string stage = 2;
  string cache_key = 3;
  string backing_snapshot_id = 4;
  string storage_ref = 5;
  string parent_cache_key = 6;
  string zfs_snapshot_guid = 7;
  string zfs_parent_snapshot_guid = 8;
  string producer_version = 9;
  string backend = 10;
  string storage_driver = 11;
  string architecture = 12;
  string policy_hash = 13;
  int64 estimated_bytes = 14;
  google.protobuf.Timestamp expires_at = 15;
  string parent_stage = 16;
}

message Execution {
  string execution_id = 1;
  string sandbox_id = 2;
  ExecutionStatus status = 3;
  repeated string command = 4;
  int32 exit_code = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  bool tty = 8;
  ExecutionKind kind = 10;
  reserved 9;
  reserved "run_id";
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_QUEUED = 1;
  EXECUTION_STATUS_RUNNING = 2;
  EXECUTION_STATUS_SUCCEEDED = 3;
  EXECUTION_STATUS_FAILED = 4;
  EXECUTION_STATUS_CANCELED = 5;
  EXECUTION_STATUS_TIMED_OUT = 6;
}

enum ExecutionKind {
  EXECUTION_KIND_UNSPECIFIED = 0;
  EXECUTION_KIND_BATCH = 1;
  EXECUTION_KIND_INTERACTIVE = 2;
}

message ExecutionOptions {
  reserved 2, 7;
  reserved "read_only_workspace", "cwd";
  int64 launch_seconds = 5;
  bool tty = 6;
  bool preserve_repository_changeset_pending_execution = 8;
  bool skip_run_before = 9;
}

message CreateExecutionRequest {
  string sandbox_id = 1;
  repeated string command = 2;
  ExecutionOptions options = 3;
  ExecutionKind kind = 4;
  RepositoryCheckout repository_checkout = 5;
  repeated string env = 6;
}

message CreateExecutionResponse {
  Execution execution = 1;
}

message AttachExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  uint32 initial_cols = 3;
  uint32 initial_rows = 4;
}

message AttachExecutionResponse {
  string session_id = 1;
  string session_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string quic_endpoint = 4;
  string alpn = 5;
  string server_cert_pin_sha256 = 6;
}

message GetExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
}

message GetExecutionResponse {
  Execution execution = 1;
}

message InspectExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
}

message InspectExecutionResponse {
  Execution execution = 1;
  string message = 2;
  string stdout = 3;
  string stderr = 4;
  string image_ref = 5;
  string image_digest = 6;
  string artifacts_dir = 7;
  string plan_path = 8;
  bool launched_vm = 9;
  google.protobuf.Struct observability = 10;
  string trace_id = 11;
  string trace_url = 12;
}

message CancelExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  int32 signal = 3;
}

message CancelExecutionResponse {
  string sandbox_id = 1;
  string execution_id = 2;
  bool accepted = 3;
  ExecutionStatus status = 4;
}

message WriteExecutionStdinRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  bytes data = 3;
}

message WriteExecutionStdinResponse {}

message CloseExecutionStdinRequest {
  string sandbox_id = 1;
  string execution_id = 2;
}

message CloseExecutionStdinResponse {}

message StreamExecutionRequest {
  string sandbox_id = 1;
  string execution_id = 2;
  bool follow = 3;
}

message ExecutionExit {
  int32 exit_code = 1;
  ExecutionStatus status = 2;
  string message = 3;
}

message ExecutionStreamEvent {
  string sandbox_id = 1;
  string execution_id = 2;
  ExecutionStatus status = 3;

  oneof payload {
    bytes stdout = 4;
    bytes stderr = 5;
    ExecutionExit exit = 6;
    string message = 7;
    string warning = 11;
  }

  google.protobuf.Timestamp occurred_at = 8;
  string image_ref = 9;
  string image_digest = 10;
}

message SandboxPortOpenResult {
  string error = 1;
}

// SandboxResources reports backend-effective resource ceilings for a sandbox.
//
// Values are resolved after runtime config, backend defaults, and policy
// resource floors are merged. They describe the sandbox's effective launch
// envelope, not exact host reservations.
message SandboxResources {
  int64 vcpus = 1;
  int64 memory_bytes = 2;
  int64 disk_bytes = 3;
}
