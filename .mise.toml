[tools]
go = "1.23"
terraform = "1.12.2"
shellcheck = "latest"
hyperfine = "latest"
svu = "3"

[env]
GOTOOLCHAIN = "local"

[tasks.test]
description = "Run cross-platform Go test suite"
run = "go test ./..."

[tasks.lint-shell]
description = "Lint shell scripts"
run = "shellcheck -x scripts/bootstrap-buildkite-agent.sh scripts/bootstrap-buildkite-agent-macos.sh scripts/bootstrap-cleanroom-host.sh scripts/cleanroom-root-helper.sh scripts/benchmark-tti.sh scripts/build-go.sh scripts/install-go.sh scripts/install.sh scripts/release.sh scripts/ci-bootstrap-linux-ssm.sh scripts/ci-cleanroom-e2e.sh scripts/ci-darwin-vz-e2e.sh"

[tasks.test-full]
description = "Run full Go test suite"
run = "go test ./..."

[tasks."build:go"]
description = "Build staged host binaries into dist/<os>-<arch>/"
run = "scripts/build-go.sh"

[tasks."build:darwin"]
description = "Build macOS darwin-vz helper into the staged dist layout"
run = "{% if os() == \"macos\" %}scripts/build-darwin-vz-helper.sh{% else %}true{% endif %}"

[tasks."build:image:alpine"]
description = "Build local alpine base image"
run = "docker build -f images/Dockerfile.base-image -t cleanroom-base:alpine ."

[tasks."build:image:alpine-docker"]
description = "Build local alpine-docker base image"
run = "docker build -f images/Dockerfile.base-image-docker -t cleanroom-base:alpine-docker ."

[tasks."build:image:alpine-agents"]
description = "Build local alpine-agents base image"
run = "docker build -f images/Dockerfile.base-image-agents -t cleanroom-base:alpine-agents ."

[tasks."build:images"]
description = "Build all local base images"
depends = ["build:image:alpine", "build:image:alpine-docker", "build:image:alpine-agents"]
run = "true"

[tasks.build]
description = "Build staged binaries into dist/<os>-<arch>/"
depends = ["build:go", "build:darwin"]
run = "true"

[tasks."install:go"]
description = "Install the cleanroom CLI into GOBIN (or GOPATH/bin)"
run = "scripts/install-go.sh"

[tasks.install]
description = "Install the staged runtime into ~/.local"
depends = ["build"]
run = "CLEANROOM_GLOBAL_PREFIX=\"$HOME/.local\" scripts/install-global.sh"

[tasks."install:global"]
description = "Install the staged runtime into /usr/local"
depends = ["build"]
run = "CLEANROOM_GLOBAL_PREFIX=\"/usr/local\" scripts/install-global.sh"

[tasks.doctor]
description = "Run cleanroom diagnostics"
run = "go run ./cmd/cleanroom doctor"

[tasks.doctor-json]
description = "Run cleanroom diagnostics as JSON"
run = "go run ./cmd/cleanroom doctor --json"

[tasks."ci:bootstrap:linux"]
description = "Rerun Linux CI bootstrap over SSM"
run = "scripts/ci-bootstrap-linux-ssm.sh run"

[tasks."ci:bootstrap:linux:logs"]
description = "Fetch Linux CI bootstrap logs over SSM"
run = "scripts/ci-bootstrap-linux-ssm.sh logs"

[tasks.check]
description = "Run build, test, and lint"
depends = ["build", "test", "lint-shell"]
run = "true"

[tasks.release]
description = "Tag the next version and push to trigger a release"
depends = ["check"]
run = "scripts/release.sh"
