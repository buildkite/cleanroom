steps:
  - label: ":shell: Shellcheck"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: shellcheck
    command: shellcheck -x .buildkite/hooks/pre-command scripts/base-image-tag.sh scripts/cleanroom-root-helper.sh scripts/benchmark-tti.sh scripts/build-go.sh scripts/install-go.sh scripts/install.sh scripts/install-global.sh scripts/package-darwin-vz-helper.sh scripts/release.sh scripts/e2e-observability.sh scripts/ci-with-host-lock.sh scripts/ci-go-test-engine.sh scripts/ci-auth-oidc-smoke.sh scripts/ci-example-smoke.sh scripts/ci-examples-firecracker.sh scripts/ci-examples-darwin-vz.sh scripts/ci-cleanroom-e2e.sh scripts/ci-darwin-vz-e2e.sh scripts/ci-darwin-vz-filehandle-e2e.sh scripts/build-macos-release-pkg.sh scripts/notarize-macos-package.sh scripts/ci-macos-release-pkg.sh scripts/ci-buildkite-release.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":test_tube: Test (Linux)"
    parallelism: 4
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: gotestsum
      - github.com/buildkite-plugins/test-collector-buildkite-plugin#v1.11.0:
          files: "tmp/test-engine/*.xml"
          format: "junit"
    command: scripts/ci-go-test-engine.sh
    artifact_paths:
      - "tmp/test-engine/*.xml"
    env:
      BUILDKITE_TEST_ENGINE_SUITE_SLUG: cleanroom-go-linux
      BUILDKITE_TEST_ENGINE_TEST_RUNNER: gotest
      BUILDKITE_TEST_ENGINE_RETRY_COUNT: "1"
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
        - "~/.cache/cleanroom/test-engine"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":closed_lock_with_key: Auth OIDC smoke"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-auth-oidc-smoke.sh
    agents:
      queue: hosted

  - label: ":test_tube: Test (macOS)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: go test ./...
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: cleanroom-mac

  - label: ":apple: E2E (darwin-vz)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-with-host-lock.sh cleanroom-darwin-vz scripts/ci-darwin-vz-e2e.sh
    agents:
      queue: cleanroom-mac

  - label: ":apple: E2E (darwin-vz filehandle)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-with-host-lock.sh cleanroom-darwin-vz scripts/ci-darwin-vz-filehandle-e2e.sh
    agents:
      queue: cleanroom-mac

  - label: ":package: macOS release pkg"
    key: macos-release-pkg
    if: build.tag != null || build.branch == "codex/macos-notarized-release-pkg"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-macos-release-pkg.sh
    concurrency: 1
    concurrency_group: cleanroom-macos-release-pkg
    env:
      CLEANROOM_SIGNING_JOB: "1"
      CLEANROOM_DARWIN_VZ_HELPER_SIGN_IDENTIFIER: com.buildkite.cleanroom.darwin-vz
    agents:
      queue: cleanroom-mac-signer

  - label: ":fire: E2E (Firecracker)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-with-host-lock.sh cleanroom-firecracker scripts/ci-cleanroom-e2e.sh
    agents:
      queue: cleanroom

  - label: ":book: Examples (macOS)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-with-host-lock.sh cleanroom-darwin-vz scripts/ci-examples-darwin-vz.sh
    agents:
      queue: cleanroom-mac

  - label: ":book: Examples (Linux)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-with-host-lock.sh cleanroom-firecracker scripts/ci-examples-firecracker.sh
    agents:
      queue: cleanroom

  - wait

  - label: ":rocket: Publish release"
    if: build.tag != null
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: scripts/ci-buildkite-release.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted
