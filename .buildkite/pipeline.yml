steps:
  - label: ":shell: Shellcheck"
    plugins:
      - github.com/lox/mise-buildkite-plugin#a172963b3d34e98601e2a65c7dd08211fb49b7f0:
          version: "2026.5.12"
    command: shellcheck -x scripts/base-image-tag.sh scripts/cleanroom-root-helper.sh scripts/benchmark-tti.sh scripts/build-go.sh scripts/install-go.sh scripts/install.sh scripts/install-global.sh scripts/package-darwin-vz-helper.sh scripts/release.sh scripts/e2e-observability.sh scripts/ci-example-smoke.sh scripts/ci-examples-firecracker.sh scripts/ci-examples-darwin-vz.sh scripts/ci-cleanroom-e2e.sh scripts/ci-darwin-vz-e2e.sh scripts/ci-darwin-vz-filehandle-e2e.sh scripts/build-macos-release-pkg.sh scripts/notarize-macos-package.sh scripts/ci-macos-release-pkg.sh scripts/build-darwin-vz-minimal-kernel-release.sh scripts/ci-darwin-vz-kernel-release.sh scripts/ci-buildkite-release.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":test_tube: Test (Linux)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: go test ./...
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":test_tube: Test (macOS)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: go test ./...
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: cleanroom-mac

  - label: ":apple: E2E (darwin-vz)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-darwin-vz-e2e.sh
    concurrency: 1
    concurrency_group: cleanroom-darwin-vz-e2e
    agents:
      queue: cleanroom-mac

  - label: ":apple: E2E (darwin-vz filehandle)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-darwin-vz-filehandle-e2e.sh
    concurrency: 1
    concurrency_group: cleanroom-darwin-vz-e2e
    agents:
      queue: cleanroom-mac

  - label: ":package: macOS release pkg"
    key: macos-release-pkg
    if: build.tag != null || build.branch == "codex/macos-notarized-release-pkg"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-macos-release-pkg.sh
    concurrency: 1
    concurrency_group: cleanroom-macos-release-pkg
    env:
      CLEANROOM_SIGNING_JOB: "1"
      CLEANROOM_DARWIN_VZ_HELPER_SIGN_IDENTIFIER: com.buildkite.cleanroom.darwin-vz
    agents:
      queue: cleanroom-mac-signer

  - label: ":penguin: darwin-vz kernel release assets"
    key: darwin-vz-kernel-release-assets
    if: build.tag != null
    command: scripts/ci-darwin-vz-kernel-release.sh
    concurrency: 1
    concurrency_group: cleanroom-darwin-vz-kernel-release
    agents:
      queue: cleanroom

  - label: ":fire: E2E (Firecracker)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-cleanroom-e2e.sh
    concurrency: 1
    concurrency_group: cleanroom-e2e
    agents:
      queue: cleanroom

  - label: ":book: Examples (macOS)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-examples-darwin-vz.sh
    concurrency: 1
    concurrency_group: cleanroom-darwin-vz-e2e
    agents:
      queue: cleanroom-mac

  - label: ":book: Examples (Linux)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-examples-firecracker.sh
    concurrency: 1
    concurrency_group: cleanroom-e2e
    agents:
      queue: cleanroom

  - wait

  - label: ":rocket: Publish release"
    if: build.tag != null
    plugins:
      - github.com/lox/mise-buildkite-plugin#a172963b3d34e98601e2a65c7dd08211fb49b7f0:
          version: "2026.5.12"
    command: scripts/ci-buildkite-release.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted
