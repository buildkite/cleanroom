steps:
  - label: ":shell: Shellcheck"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: shellcheck
    command: shellcheck -x .buildkite/hooks/pre-command scripts/base-image-tag.sh scripts/cleanroom-root-helper.sh scripts/benchmark-tti.sh scripts/build-go.sh scripts/install-go.sh scripts/install.sh scripts/release.sh scripts/ci-go-test-engine.sh scripts/ci-auth-oidc-smoke.sh scripts/ci-bake-smoke.sh scripts/ci-buildkite-release.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":test_tube: Test (Linux)"
    parallelism: 4
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: gotestsum
      - test-collector#v1.11.0:
          files: "tmp/test-engine/*.xml"
          format: "junit"
    command: scripts/ci-go-test-engine.sh
    artifact_paths:
      - "tmp/test-engine/*.xml"
    env:
      BUILDKITE_TEST_ENGINE_SUITE_SLUG: cleanroom-go-linux
      BUILDKITE_TEST_ENGINE_TEST_RUNNER: gotest
      BUILDKITE_TEST_ENGINE_RETRY_COUNT: "1"
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
        - "~/.cache/cleanroom/test-engine"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":closed_lock_with_key: Auth OIDC smoke"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
    command: scripts/ci-auth-oidc-smoke.sh
    agents:
      queue: hosted

  - label: ":protobuf: Schema"
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: buf
    command: buf lint
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":test_tube: Test (macOS)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: gotestsum
      - test-collector#v1.11.0:
          files: "tmp/test-engine/*.xml"
          format: "junit"
    command: scripts/ci-go-test-engine.sh
    artifact_paths:
      - "tmp/test-engine/*.xml"
    env:
      BUILDKITE_TEST_ENGINE_SUITE_SLUG: cleanroom-go-darwin
      BUILDKITE_TEST_ENGINE_TEST_RUNNER: gotest
      BUILDKITE_TEST_ENGINE_RETRY_COUNT: "1"
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
        - "~/.cache/cleanroom/test-engine"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: cleanroom-mac

  - label: ":cook: Bake E2E (macOS)"
    plugins:
      - github.com/buildkite-plugins/setup-go-buildkite-plugin#daa7af945245588f85b76ba7fe0a9af3d87dbf91:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: github:sporevm/sporevm
    command: scripts/ci-bake-smoke.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: cleanroom-mac

  - wait

  - label: ":protobuf: Publish schema"
    key: publish-schema
    if: build.branch == "main" || build.tag != null
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
          install_args: buf
    command: mise run proto:push
    secrets:
      - BUF_TOKEN
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":rocket: Publish release"
    depends_on: publish-schema
    if: build.tag != null
    plugins:
      - mise#a5845c5082d3a4fe36dd77ae74973dfc86fc91a2:
          version: "2026.5.12"
    command: scripts/ci-buildkite-release.sh
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted
