env:
  MISE_YES: "1"
  MISE_TRUSTED_CONFIG_PATHS: /buildkite/builds

steps:
  - label: ":shell: Shellcheck"
    command: mise run lint-shell
    agents:
      queue: hosted

  - label: ":test_tube: Test (Linux)"
    command: mise run test
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: hosted

  - label: ":test_tube: Test (macOS)"
    command: mise run test
    cache:
      paths:
        - "~/.local/share/mise"
        - "~/.cache/mise"
        - "~/.local/state/mise"
      size: "20g"
      name: "mise-cache"
    agents:
      queue: cleanroom-mac

  - label: ":apple: E2E (darwin-vz)"
    command: scripts/ci-darwin-vz-e2e.sh
    concurrency: 1
    concurrency_group: cleanroom-darwin-vz-e2e
    agents:
      queue: cleanroom-mac

  - label: ":fire: E2E (Firecracker)"
    command: scripts/ci-cleanroom-e2e.sh
    concurrency: 1
    concurrency_group: cleanroom-e2e
    env:
      CLEANROOM_KERNEL_IMAGE: /var/lib/buildkite-agent/.local/share/cleanroom/images/vmlinux.bin
      CLEANROOM_FIRECRACKER_BINARY: /usr/local/bin/firecracker
      CLEANROOM_PRIVILEGED_MODE: helper
      CLEANROOM_PRIVILEGED_HELPER_PATH: /usr/local/sbin/cleanroom-root-helper
    agents:
      queue: cleanroom
